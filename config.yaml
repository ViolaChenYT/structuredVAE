# Configuration file for parallel scVAE training workflow

# Base paths
base_path: "/n/fs/ragr-data/users/viola/structuredVAE/"

# Input data files
adata_file: "data/packer2019_preprocessed.h5ad"
paths_dict_file: "/n/fs/ragr-data/users/viola/mouse_dev/scripts/new_c_elegans/paths_dict_tree.json.gz"
node_abbrev_file: "/n/fs/ragr-data/users/viola/mouse_dev/scripts/new_c_elegans/original_to_merged1.csv"
